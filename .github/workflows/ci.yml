# The tests, the generated tables and the ECMA-262 test data, on Julia's long-term support release (the package's floor,
# the julia entry of Project.toml) and the latest, on Linux, Windows, macOS and Linux on arm64; and on Linux, the data
# as its own scripts write it for Unicode 13 and 18 and for the grammar of ECMAScript 2020. The data
# (github.com/corvus-dotnet/ecma262-regex-test-data) is pinned to a commit; the pass is 0 wrong answers, 0 refusals of a
# valid pattern, 0 acceptances of an invalid one and 0 matches at their limit, in both encodings.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Julia ${{ matrix.julia }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
        julia: [lts, '1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
      # No cache action: the package has no dependencies and precompiles in seconds.
      with:
        version: ${{ matrix.julia }}
    - name: Test
      run: julia --startup-file=no --color=yes --project=. -e 'using Pkg; Pkg.test()'
    - name: Test with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: julia --startup-file=no --color=yes --project=. -e 'using Pkg; Pkg.test()'
      env:
        CORVUS_REGEX_MEMO_FROM_THE_START: '1'
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The Unicode tables and the properties of strings are written from the Rust crate's, at the version this engine
      # ports.
      if: runner.os == 'Linux'
      with:
        repository: corvus-dotnet/corvus-regex-ecma262-rs
        ref: 1036f8707c25b49d826501132619c5671431d685
        path: corvus-regex-ecma262-rs
        persist-credentials: false
    - name: The generated tables are current
      if: runner.os == 'Linux'
      # The tables and the properties of strings of each version of Unicode, and the property names of ECMAScript 2020.
      run: |
        src=corvus-regex-ecma262-rs/corvus-regex-ecma262/src
        for major in 13 17 18; do
          python3 tools/unicode/gen_tables.py $src/tables$major.rs --check
          python3 tools/unicode/gen_strings.py $src/strings$major.rs --check
        done
        python3 tools/unicode/gen_es2020.py $src/es2020.rs --check
    - name: The version is stamped
      # What a release does before it tags (tools/release/stamp.ps1), with a tag no release has, so that a moved or
      # renamed placeholder fails here and not in a release.
      shell: pwsh
      run: |
        ./tools/release/stamp.ps1 -Tag v99.98.97
        if (-not (Select-String -Path Project.toml -SimpleMatch 'version = "99.98.97"' -Quiet)) { throw 'the version was not stamped' }
        julia --startup-file=no --project=. -e 'using CorvusRegexEcma262; v = pkgversion(CorvusRegexEcma262); v == v"99.98.97" || error("pkgversion is $v")'
        git checkout -- Project.toml
    - name: The benchmark harness's scripts read
      # The harness itself runs in the harness-image workflow; here its scripts are parsed on every Julia.
      if: runner.os == 'Linux'
      run: |
        julia --startup-file=no -e 'for f in ("tools/benchmarks/industry.jl", "tools/dataset/run.jl", "tools/stackprobe/run.jl"); any(e -> e isa Expr && e.head in (:error, :incomplete), Meta.parseall(read(f, String); filename=f).args) && error("$f does not parse"); end'
        python3 -m py_compile tools/benchmarks/industry-results.py tools/benchmarks/count-gate.py tools/benchmarks/v8/workloads.py
        bash -n tools/benchmarks/run.sh tools/benchmarks/build.sh tools/benchmarks/container-entry.sh
    - name: Probe for stack overflows
      # Deep, wide and long patterns in every grammar through every verb, each in a task with a stack of 4 MB (Julia's
      # default) and of 2 MB: none may overflow it (tools/stackprobe).
      run: julia --startup-file=no --project=. tools/stackprobe/run.jl
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 1b4c4353c4fa3fc3e318db32ef0261391519b9a5
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: Run the ECMA-262 test data
      run: julia --startup-file=no --project=. -t 4 tools/dataset/run.jl ecma262-regex-test-data/data wrong-cases.tsv
    - name: Run the ECMA-262 test data with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: julia --startup-file=no --project=. -t 4 tools/dataset/run.jl ecma262-regex-test-data/data wrong-cases-memo.tsv
      env:
        CORVUS_REGEX_MEMO_FROM_THE_START: '1'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: runner.os == 'Linux'
      with:
        node-version: '24.22.1'
    - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
      # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
      # ECMAScript 2020 (edition.js apply), each judged with the engine set to match.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        data=ecma262-regex-test-data
        failed=()
        run() {
          name=$1; shift
          out="$RUNNER_TEMP/$name"
          case "$1" in
            unicode.js) node "$data/unicode.js" apply "$2" "$out" "$data/data" ;;
            edition.js) node "$data/edition.js" apply "$out" "$2" "$data/data" ;;
          esac
          shift 2
          julia --startup-file=no --project=. -t 4 tools/dataset/run.jl "$out" "wrong-cases-$name.tsv" "$@" || failed+=("$name")
        }
        run unicode-13 unicode.js 13.0 --unicode 13
        run unicode-18 unicode.js 18.0 --unicode 18
        # An empty version is the data's own Unicode.
        run es2020 edition.js "" --edition es2020
        run es2020-unicode-13 edition.js 13.0 --edition es2020 --unicode 13
        if [ ${#failed[@]} -gt 0 ]; then echo "::error::Wrong: ${failed[*]}"; exit 1; fi
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.os }}-julia${{ matrix.julia }}
        path: wrong-cases*.tsv

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
